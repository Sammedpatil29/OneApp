name: Build and Sign Android App (AAB & APK)
name: Build and Sign Android App (Multi-Environment)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Build Environment (testing or production)'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - production
  push:
    branches:
      - main
      - master
      - prod

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: env-selector
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            SELECTED_ENV="production"
          else
            SELECTED_ENV="testing"
          fi

          echo "TARGET_ENV=$SELECTED_ENV" >> $GITHUB_ENV
          if [ "$SELECTED_ENV" = "production" ]; then
            echo "BUILD_CONFIG=production" >> $GITHUB_ENV
            echo "ENV_LABEL=Production (Pintu Live)" >> $GITHUB_ENV
          else
            echo "BUILD_CONFIG=testing" >> $GITHUB_ENV
            echo "ENV_LABEL=Testing (Render Staging)" >> $GITHUB_ENV
          fi

          echo "=================================================="
          echo "🚀 Targeted Environment: $SELECTED_ENV"
          echo "⚙️ Angular Configuration: $BUILD_CONFIG"
          echo "=================================================="

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install -g @ionic/cli
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: ionic build --prod
      - name: Configure Capacitor Environment
        run: |
          node scripts/set-env.mjs ${{ env.TARGET_ENV }}

      - name: Build Web Assets (${{ env.BUILD_CONFIG }})
        run: |
          npm run build -- --configuration=${{ env.BUILD_CONFIG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Android SDK Build Tools
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project (Copy Fresh Web Assets)
      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Release (Clean, AAB & APK)
      - name: Build Android Release (AAB & APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --rerun-tasks
          if [ "${{ env.TARGET_ENV }}" = "production" ]; then
            ./gradlew clean assembleRelease bundleRelease --no-daemon --rerun-tasks
          else
            ./gradlew clean assembleRelease --no-daemon --rerun-tasks
          fi

      - name: Prepare Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > pintu-release.keystore
          elif [ -f "pintu-release.keystore" ]; then
            echo "Using existing repository keystore: pintu-release.keystore"
          else
            echo "❌ Error: Keystore not found in repository or secrets!"
            exit 1
          fi

      - name: Sign Android App Bundle (.aab) & APK (.apk)
      - name: Sign Android APK and AAB
        env:
          KEYSTORE_PATH: pintu-release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pintu-alias' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          AAB_SIGNED="android/app/build/outputs/bundle/release/pintu-release-signed.aab"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          FINAL_UNSIGNED_APK="android/app/build/outputs/apk/release/pintu-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/pintu-release-signed.apk"
          FINAL_UNSIGNED_APK="android/app/build/outputs/apk/release/pintu-${{ env.TARGET_ENV }}-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/pintu-${{ env.TARGET_ENV }}-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/pintu-customer-${{ env.TARGET_ENV }}-signed.apk"

          echo "🔐 Signing .aab bundle with jarsigner..."
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_FILE" "$KEY_ALIAS"
          else
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              "$AAB_FILE" "$KEY_ALIAS"
          fi
          cp "$AAB_FILE" "$AAB_SIGNED"

          echo "📦 Aligning and Signing .apk with apksigner..."
          # 1. Sign APK
          if [ -f "$UNSIGNED_APK" ]; then
            cp "$UNSIGNED_APK" "$FINAL_UNSIGNED_APK"
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK" || cp "$UNSIGNED_APK" "$ALIGNED_APK"
            
            if [ -n "$KEYSTORE_PASSWORD" ]; then
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks "$KEYSTORE_PATH" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "$SIGNED_APK" \
                "$ALIGNED_APK"
            else
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks "$KEYSTORE_PATH" \
                --ks-key-alias "$KEY_ALIAS" \
                --out "$SIGNED_APK" \
                "$ALIGNED_APK"
            fi

            echo "✅ Verifying signed APK signature..."
            $BUILD_TOOLS_DIR/apksigner verify "$SIGNED_APK"
          else
            echo "⚠️ Unsigned APK not found at $UNSIGNED_APK"
          fi

          # 2. Sign AAB (Production only)
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          SIGNED_AAB="android/app/build/outputs/bundle/release/pintu-customer-${{ env.TARGET_ENV }}-signed.aab"
          if [ -f "$AAB_FILE" ]; then
            echo "🔐 Signing .aab bundle with jarsigner..."
            if [ -n "$KEYSTORE_PASSWORD" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "$AAB_FILE" "$KEY_ALIAS"
            else
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_PATH" \
                "$AAB_FILE" "$KEY_ALIAS"
            fi
            cp "$AAB_FILE" "$SIGNED_AAB"
          fi

      - name: Verify Compiled APK Manifest Permissions
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          SIGNED_APK="android/app/build/outputs/apk/release/pintu-release-signed.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/pintu-customer-${{ env.TARGET_ENV }}-signed.apk"

          echo "=================================================="
          echo "🔍 Inspecting Manifest Permissions in Compiled APK"
          echo "🔍 Inspecting Manifest Permissions in Compiled APK (${{ env.TARGET_ENV }})"
          echo "=================================================="
          if [ -f "$SIGNED_APK" ]; then
            $BUILD_TOOLS_DIR/aapt dump permissions "$SIGNED_APK" || echo "aapt dump permissions finished"
            echo ""
            echo "📋 Detailed APK Badging Summary:"
            $BUILD_TOOLS_DIR/aapt dump badging "$SIGNED_APK" | grep -E "package|uses-permission" || true
          else
            echo "❌ Signed APK not found for permission validation!"
            exit 1
          fi

      - name: Upload Signed .APK (Ready for Direct Install)
      - name: Upload Signed .APK
        uses: actions/upload-artifact@v4
        with:
          name: pintu-customer-signed-apk
          path: android/app/build/outputs/apk/release/pintu-release-signed.apk
          name: pintu-customer-${{ env.TARGET_ENV }}-signed-apk
          path: android/app/build/outputs/apk/release/pintu-customer-${{ env.TARGET_ENV }}-signed.apk
          retention-days: 14

      - name: Upload Unsigned .APK
      - name: Upload Signed .AAB (Google Play Store Bundle - Production)
        if: env.TARGET_ENV == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: pintu-customer-unsigned-apk
          path: android/app/build/outputs/apk/release/pintu-release-unsigned.apk
          name: pintu-customer-prod-signed-aab
          path: android/app/build/outputs/bundle/release/pintu-customer-production-signed.aab
          retention-days: 14

      - name: Upload Signed .AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: pintu-customer-signed-aab
          path: android/app/build/outputs/bundle/release/pintu-release-signed.aab
          retention-days: 14
