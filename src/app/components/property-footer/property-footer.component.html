<footer class="property-brand-footer">
  <!-- Subtle Gradient Divider Line (Matching Main Footer) -->
  <div class="footer-divider-line"></div>

  <div class="footer-content-wrapper">
    <!-- Top label: Powered by -->
    <div class="powered-by-label">Managed By</div>

    <!-- Partner Card: Top Logo, Centered Details Below -->
    <div class="partner-card">
      <div class="brand-logo-wrap">
        <!-- Logo from assets: Update path or pass [logoUrl] -->
        <img
          [src]="logoUrl"
          [alt]="companyName"
          class="brand-logo-img"
          (error)="onImageError($event)"
        />
      </div>

      <div class="brand-text-col">
        <h4 class="brand-name text-center">{{ companyName }}</h4>
        <span class="brand-gst text-nowrap text-center">opp. Durgalakshmi theatre, Miraj Road, Athani - 591304.</span>
        <span class="brand-gst text-center">GSTIN: 29XXXXX0000X1ZX MOB: 8884950068</span>
      </div>
    </div>
  </div>
</footer>
