<nav class="customer-bottom-bar">
  <button
    type="button"
    class="nav-tab"
    [class.active]="isTabActive('/layout/home')"
    (click)="goToTab('home')"
    aria-label="Home">
    <div class="tab-icon-wrapper">
      <ion-icon [name]="isTabActive('/layout/home') ? 'compass' : 'compass-outline'"></ion-icon>
    </div>
    <span>Home</span>
    @if (isTabActive('/layout/home')) {
      <span class="active-dot"></span>
    }
  </button>

  <button
    type="button"
    class="nav-tab"
    [class.active]="isTabActive('/layout/history')"
    (click)="goToTab('history')"
    aria-label="Orders History">
    <div class="tab-icon-wrapper">
      <ion-icon [name]="isTabActive('/layout/history') ? 'receipt' : 'receipt-outline'"></ion-icon>
    </div>
    <span>Orders</span>
    @if (isTabActive('/layout/history')) {
      <span class="active-dot"></span>
    }
  </button>

  <button
    type="button"
    class="nav-tab"
    [class.active]="isTabActive('/layout/referral')"
    (click)="goToTab('referral')"
    aria-label="Refer and Earn">
    <div class="tab-icon-wrapper">
      <ion-icon [name]="isTabActive('/layout/referral') ? 'gift' : 'gift-outline'"></ion-icon>
    </div>
    <span>Refer</span>
    @if (isTabActive('/layout/referral')) {
      <span class="active-dot"></span>
    }
  </button>

  <button
    type="button"
    class="nav-tab"
    [class.active]="isTabActive('/layout/support')"
    (click)="goToTab('support')"
    aria-label="Help & Support">
    <div class="tab-icon-wrapper">
      <ion-icon [name]="isTabActive('/layout/support') ? 'chatbubble-ellipses' : 'chatbubble-ellipses-outline'"></ion-icon>
    </div>
    <span>Support</span>
    @if (isTabActive('/layout/support')) {
      <span class="active-dot"></span>
    }
  </button>

  <button
    type="button"
    class="nav-tab"
    [class.active]="isTabActive('/layout/profile')"
    (click)="goToTab('profile')"
    aria-label="Account Profile">
    <div class="tab-icon-wrapper">
      <ion-icon [name]="isTabActive('/layout/profile') ? 'person' : 'person-outline'"></ion-icon>
    </div>
    <span>Account</span>
    @if (isTabActive('/layout/profile')) {
      <span class="active-dot"></span>
    }
  </button>
</nav>
