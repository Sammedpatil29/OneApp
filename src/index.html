  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      overflow: hidden;
    }
    .app-initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-initial-loader .startup-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: contain;
      margin-bottom: 20px;
      box-shadow: 0 10px 24px rgba(160, 0, 226, 0.15);
    }
    .app-initial-loader .startup-spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #e2e8f0;
      border-top-color: #a000e2;
      animation: spin-startup 0.75s linear infinite;
    }
    @keyframes spin-startup {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="light">
  <app-root>
    <div class="app-initial-loader">
      <img src="assets/pintu startup.png" alt="Pintu" class="startup-logo" onerror="this.style.display='none'" />
      <div class="startup-spinner"></div>
    </div>
  </app-root>
<script
